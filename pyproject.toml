[project]
name = "churnml"
version = "0.1.0"
description = "Customer-churn ML pipeline: PostgreSQL, Pandas, scikit-learn, MLflow."
readme = "README.md"
authors = [{ name = "Alphonce Mukavhi", email = "alphoncemukavhi@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "pandas>=3.0",
    "scikit-learn>=1.8",
    "mlflow>=3.7",
    "psycopg[binary]>=3.2",
]

[project.scripts]
churnml = "churnml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnml"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running PostgreSQL (set CHURNML_TEST_DSN)"]

[tool.mypy]
strict = true
ignore_missing_imports = true
